<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dome/Arch shape with growth chart inside -->
  <g fill="#ffffff">
    <!-- Dome outline - rounded top with inward-curving sides -->
    <path d="M32 6 C22 6, 14 10, 14 18 L14 22 C14 26, 16 28, 20 28 L44 28 C48 28, 50 26, 50 22 L50 18 C50 10, 42 6, 32 6 Z" />
    
    <!-- Growth chart: 4 vertical bars of increasing height -->
    <rect x="20" y="24" width="3" height="2" />
    <rect x="25" y="22" width="3" height="4" />
    <rect x="30" y="20" width="3" height="6" />
    <rect x="35" y="18" width="3" height="8" />
    
    <!-- Diagonal line connecting bar tops (slopes upward) -->
    <line x1="21.5" y1="24" x2="36.5" y2="18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
  </g>
  
  <!-- RP letters in rectangular base -->
  <g fill="#ffffff">
    <!-- R letter (left side) -->
    <path d="M18 30 L18 40 L22 40 L22 34 L24 34 L26 36 L26 38 L24 40 L26 42 L26 44 L22 42 L22 38 L20 38 L20 30 Z" />
    <rect x="18" y="30" width="2" height="4" />
    <rect x="22" y="32" width="2" height="2" />
    
    <!-- P letter (right side, slightly taller) -->
    <path d="M28 30 L28 44 L32 44 L32 36 L34 36 L36 38 L36 40 L34 42 L36 44 L36 46 L32 44 L32 40 L30 40 L30 30 Z" />
    <rect x="28" y="30" width="2" height="4" />
    <rect x="32" y="32" width="2" height="2" />
    
    <!-- Rectangular base connecting R and P -->
    <rect x="18" y="40" width="20" height="2" />
    <rect x="18" y="42" width="2" height="2" />
    <rect x="36" y="42" width="2" height="2" />
  </g>
</svg>
