<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .logo-path {
        fill: currentColor;
      }
    </style>
  </defs>
  
  <!-- Dome/Arch shape with growth chart inside -->
  <g class="logo-path">
    <!-- Dome outline -->
    <path d="M32 8 C24 8, 18 12, 18 20 L18 24 C18 28, 20 30, 24 30 L40 30 C44 30, 46 28, 46 24 L46 20 C46 12, 40 8, 32 8 Z" />
    
    <!-- Growth chart bars inside dome -->
    <rect x="22" y="22" width="2" height="4" />
    <rect x="26" y="20" width="2" height="6" />
    <rect x="30" y="18" width="2" height="8" />
    <rect x="34" y="16" width="2" height="10" />
    
    <!-- Diagonal line connecting bar tops -->
    <line x1="23" y1="22" x2="35" y2="16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
  </g>
  
  <!-- RP letters in rectangular base -->
  <g class="logo-path">
    <!-- R letter -->
    <path d="M20 32 L20 42 L24 42 L24 36 L26 36 L28 38 L28 40 L26 42 L28 44 L28 46 L24 44 L24 40 L22 40 L22 32 Z" />
    <rect x="20" y="32" width="2" height="4" />
    <rect x="24" y="34" width="2" height="2" />
    
    <!-- P letter -->
    <path d="M30 32 L30 42 L34 42 L34 36 L36 36 L38 38 L38 40 L36 42 L38 44 L38 46 L34 44 L34 40 L32 40 L32 32 Z" />
    <rect x="30" y="32" width="2" height="4" />
    <rect x="34" y="34" width="2" height="2" />
    
    <!-- Rectangular base connecting R and P -->
    <rect x="20" y="42" width="20" height="2" />
    <rect x="20" y="44" width="2" height="2" />
    <rect x="38" y="44" width="2" height="2" />
  </g>
</svg>

